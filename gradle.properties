# Build behaviour
# UTF-8 keeps Cyrillic resource files and console output consistent across platforms.
org.gradle.jvmargs=-Xmx1G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail

# Mod metadata. Dependency and plugin versions live in gradle/libs.versions.toml.
# version is expanded into fabric.mod.json at build time; this is the only place it is written.
version=1.0
group=monosleep
